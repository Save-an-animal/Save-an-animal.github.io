<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Cat</title>
<style>
  :root {
    --bg: #fde8ef;
    --fur: #ffe0c2;
    --stripe: #ffc9a0;
    --ear: #ffb7c5;
    --ink: #5a4048;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, var(--bg), #e6e0ff);
  }
  .wrap { position: relative; }
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  svg { width: min(80vw, 380px); height: auto; cursor: pointer; outline: none; }
  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4s infinite;
  }
  .tail {
    transform-origin: 250px 270px;
    animation: wag 1.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }
  @keyframes wag {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(14deg); }
  }
  .bubble {
    position: absolute;
    top: 0;
    left: 0;
    padding: 8px 18px;
    background: #fff;
    color: var(--ink);
    border: 3px solid var(--ear);
    border-radius: 22px 22px 22px 4px;
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Segoe Print", cursive;
    font-size: 1.6rem;
    font-weight: bold;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px) scale(.8);
    transition: opacity .4s ease, transform .3s ease;
  }
  .intro {
    position: fixed;
    top: 25%;
    left: 0;
    right: 0;
    margin: 0;
    padding: 0;
    text-align: center;
    white-space: nowrap;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 3.5vw;
    pointer-events: none;
    opacity: 0;
    animation: intro 3.5s ease-in-out forwards;
  }
  @keyframes intro {
    0% { opacity: 0; transform: translateY(6px); }
    15% { opacity: 1; transform: translateY(0); }
    80% { opacity: 1; transform: translateY(-3px); }
    100% { opacity: 0; transform: translateY(-6px); }
  }
  .bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    transition: opacity 0s, transform .3s ease;
  }
  .choice {
    position: fixed; inset: 0; display: grid; place-items: start center;
    padding-top: 12px; z-index: 10;
    visibility: hidden; opacity: 0;
    transition: opacity 1s ease, visibility 1s ease;
  }
  .choice.show {
    visibility: visible; opacity: 1;
  }
  .choice-box {
    background: #fff; border-radius: 18px; padding: 24px; text-align: center;
    color: var(--ink); font-family: sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.12);
  }
  .choice-box button {
    margin: 8px; padding: 10px 18px; border: none; border-radius: 10px;
    background: var(--ear); color: var(--ink); font-size: 18px; cursor: pointer;
  }
  .choice-box a {
    display: inline-block; margin: 8px; padding: 10px 18px; border-radius: 10px;
    background: var(--stripe); color: var(--ink); font-size: 18px; text-decoration: none;
  }
</style>
</head>
<body>
<div class="choice" id="choice">
  <div class="choice-box">
    <p>This feature is coded using AI.<br>Want to continue with the AI version or the non AI version?</p>
    <button onclick="hideChoice()">Continue on AI.</button>
    <a href="non-ai/" onclick="event.preventDefault(); hideChoice('non-ai/')">Non AI.</a>
  </div>
</div>
<div class="wrap">
<h3 class="intro">This is claude coded while the main index.html site is human coded</h3>
<svg id="cat" viewBox="-20 -10 350 340" role="img" aria-label="A cute cat">
  <ellipse cx="150" cy="300" rx="85" ry="12" fill="#d9c9e8" opacity=".6"/>
  <path class="tail" d="M240 270 Q300 250 280 190" fill="none" stroke="var(--fur)" stroke-width="24" stroke-linecap="round"/>
  <ellipse cx="150" cy="235" rx="82" ry="65" fill="var(--fur)"/>
  <ellipse cx="115" cy="285" rx="22" ry="14" fill="#fff3e6"/>
  <ellipse cx="185" cy="285" rx="22" ry="14" fill="#fff3e6"/>
  <path d="M62 120 L72 50 L120 85 Z" fill="var(--fur)" stroke="var(--fur)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M238 120 L228 50 L180 85 Z" fill="var(--fur)" stroke="var(--fur)" stroke-width="12" stroke-linejoin="round"/>
  <path d="M76 98 L80 68 L102 86 Z" fill="var(--ear)" stroke="var(--ear)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M224 98 L220 68 L198 86 Z" fill="var(--ear)" stroke="var(--ear)" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="150" cy="150" rx="95" ry="80" fill="var(--fur)"/>
  <path d="M150 72 v22 M132 76 v16 M168 76 v16" stroke="var(--stripe)" stroke-width="7" stroke-linecap="round"/>
  <ellipse class="eye" cx="112" cy="150" rx="9" ry="12" fill="var(--ink)"/>
  <ellipse class="eye" cx="188" cy="150" rx="9" ry="12" fill="var(--ink)"/>
  <circle cx="115" cy="145" r="3" fill="#fff"/>
  <circle cx="191" cy="145" r="3" fill="#fff"/>
  <circle cx="82" cy="178" r="14" fill="#ffb7c5" opacity=".55"/>
  <circle cx="218" cy="178" r="14" fill="#ffb7c5" opacity=".55"/>
  <ellipse cx="150" cy="170" rx="8" ry="6" fill="#ff9eb5"/>
  <path d="M150 176 Q150 192 136 192 M150 176 Q150 192 164 192" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 165 H30 M62 178 L34 188 M240 165 H270 M238 178 L266 188" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
</svg>
<div class="bubble" id="bubble">meow</div>
</div>
<script>
  var cat = document.getElementById("cat");
  var bubble = document.getElementById("bubble");
  var ctx = null;
  var hideTimer = null;

  function meow() {
    if (!ctx) ctx = new AudioContext();
    ctx.resume().then(function () {
      var t = ctx.currentTime + 0.02;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(620, t);
      osc.frequency.linearRampToValueAtTime(980, t + 0.18);
      osc.frequency.linearRampToValueAtTime(760, t + 0.45);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.25, t + 0.05);
      gain.gain.linearRampToValueAtTime(0.25, t + 0.35);
      gain.gain.linearRampToValueAtTime(0.0001, t + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.55);
    });
  }

  function showBubble() {
    clearTimeout(hideTimer);
    bubble.style.left = Math.floor(Math.random() * 70) + "%";
    bubble.style.top = Math.floor(Math.random() * 70) + "%";
    bubble.classList.remove("show");
    void bubble.offsetWidth;
    bubble.classList.add("show");
    hideTimer = setTimeout(function () {
      bubble.classList.remove("show");
    }, 1000);
  }

  cat.addEventListener("click", function () {
    meow();
    showBubble();
  });

  var choice = document.getElementById("choice");

  function hideChoice(next) {
    choice.classList.remove("show");
    if (next) {
      setTimeout(function () {
        window.location.href = next;
      }, 1000);
    }
  }

  setTimeout(function () {
    choice.classList.add("show");
  }, 4200);
</script>
</body>
</html>
